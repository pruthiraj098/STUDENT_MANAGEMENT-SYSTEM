<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${isEdit ? 'Edit Instructor' : 'Add Instructor'} + ' - Student Management System'">Instructor Form</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<div class="app-wrapper">
    <!-- Sidebar Fragment -->
    <div th:replace="~{fragments/sidebar :: sidebar('instructors')}"></div>

    <div class="app-main">
        <!-- Header Fragment -->
        <div th:replace="~{fragments/header :: header}"></div>

        <div class="p-4 p-md-5">
            <div class="d-flex align-items-center justify-content-between mb-4">
                <div>
                    <h3 class="text-white font-heading fw-bold mb-1" th:text="${isEdit ? 'Edit Instructor Profile' : 'Add New Instructor'}">Instructor Form</h3>
                    <p class="text-muted mb-0">Fill in faculty information to create or update instructor credentials</p>
                </div>
                <a th:href="@{/instructors}" class="btn btn-outline-secondary rounded-3">
                    <i class="fa-solid fa-arrow-left me-1"></i> Back to Directory
                </a>
            </div>

            <div class="glass-card p-4 p-md-5 style-form-card" style="max-width: 800px;">
                <form th:action="@{/instructors/save}" th:object="${instructorDto}" method="post">
                    <input type="hidden" th:field="*{id}">
                    <input type="hidden" th:field="*{staffId}">

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="firstName" class="form-label text-muted small fw-semibold">FIRST NAME <span class="text-danger">*</span></label>
                            <input type="text" id="firstName" th:field="*{firstName}" class="form-control custom-input" placeholder="Alan" required>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></div>
                        </div>
                        <div class="col-md-6">
                            <label for="lastName" class="form-label text-muted small fw-semibold">LAST NAME <span class="text-danger">*</span></label>
                            <input type="text" id="lastName" th:field="*{lastName}" class="form-control custom-input" placeholder="Turing" required>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></div>
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="email" class="form-label text-muted small fw-semibold">EMAIL ADDRESS <span class="text-danger">*</span></label>
                            <input type="email" id="email" th:field="*{email}" class="form-control custom-input" placeholder="dr.alan@sms.edu" required>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                        </div>
                        <div class="col-md-6">
                            <label for="phone" class="form-label text-muted small fw-semibold">PHONE NUMBER</label>
                            <input type="text" id="phone" th:field="*{phone}" class="form-control custom-input" placeholder="+1-555-0101">
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="designation" class="form-label text-muted small fw-semibold">DESIGNATION <span class="text-danger">*</span></label>
                            <select id="designation" th:field="*{designation}" class="form-select custom-input" required>
                                <option value="Professor">Professor</option>
                                <option value="Associate Professor">Associate Professor</option>
                                <option value="Assistant Professor">Assistant Professor</option>
                                <option value="Senior Lecturer">Senior Lecturer</option>
                                <option value="Lecturer">Lecturer</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="departmentId" class="form-label text-muted small fw-semibold">DEPARTMENT</label>
                            <select id="departmentId" th:field="*{departmentId}" class="form-select custom-input">
                                <option value="">-- Select Department --</option>
                                <option th:each="d : ${departments}" th:value="${d.id}" th:text="${d.name} + ' (' + ${d.code} + ')'"></option>
                            </select>
                        </div>
                    </div>

                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label for="status" class="form-label text-muted small fw-semibold">ACCOUNT STATUS</label>
                            <select id="status" th:field="*{status}" class="form-select custom-input">
                                <option value="ACTIVE">ACTIVE</option>
                                <option value="INACTIVE">INACTIVE</option>
                            </select>
                        </div>
                        <div class="col-md-6" th:if="${!isEdit}">
                            <label for="password" class="form-label text-muted small fw-semibold">INITIAL PASSWORD</label>
                            <input type="password" id="password" th:field="*{password}" class="form-control custom-input" placeholder="Default: instructor123">
                            <div class="form-text text-muted small">Leave blank to use default temporary password 'instructor123'.</div>
                        </div>
                    </div>

                    <div class="d-flex gap-3">
                        <button type="submit" class="btn btn-gradient-primary px-4 py-2">
                            <i class="fa-solid fa-save me-1"></i> <span th:text="${isEdit ? 'Save Changes' : 'Create Account'}">Save</span>
                        </button>
                        <a th:href="@{/instructors}" class="btn btn-outline-secondary px-4 py-2">Cancel</a>
                    </div>
                </form>
            </div>
        </div>

        <!-- Footer Fragment -->
        <div th:replace="~{fragments/footer :: footer}"></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
