<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Catalog - Student Management System</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<div class="app-wrapper">
    <!-- Sidebar Fragment -->
    <div th:replace="~{fragments/sidebar :: sidebar('courses')}"></div>

    <div class="app-main">
        <!-- Header Fragment -->
        <div th:replace="~{fragments/header :: header}"></div>

        <div class="p-4 p-md-5">
            <div th:if="${successMsg}" class="alert alert-success border-0 rounded-3 mb-4" style="background: rgba(16, 185, 129, 0.2); color: #a7f3d0;" th:text="${successMsg}"></div>

            <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4">
                <div>
                    <h3 class="text-white font-heading fw-bold mb-1">Academic Course Catalog</h3>
                    <p class="text-muted mb-0">Browse and manage registered courses across departments</p>
                </div>
                <div sec:authorize="hasRole('ADMIN')">
                    <a th:href="@{/courses/new}" class="btn btn-gradient-primary">
                        <i class="fa-solid fa-plus me-1"></i> Add New Course
                    </a>
                </div>
            </div>

            <div class="glass-card p-4">
                <div class="table-responsive">
                    <table class="custom-table">
                        <thead>
                            <tr>
                                <th>Code</th>
                                <th>Course Title</th>
                                <th>Department</th>
                                <th>Credits</th>
                                <th>Instructor</th>
                                <th class="text-end" sec:authorize="hasRole('ADMIN')">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="c : ${courses}">
                                <td><code style="color: var(--accent-cyan);" th:text="${c.code}">CS101</code></td>
                                <td>
                                    <div class="fw-semibold text-white" th:text="${c.title}">Intro to Java</div>
                                    <div style="font-size: 0.75rem; color: var(--text-dim);" th:text="${c.description}">Description</div>
                                </td>
                                <td>
                                    <span class="badge bg-secondary opacity-75" th:text="${c.department != null ? c.department.name : 'N/A'}">DEPT</span>
                                </td>
                                <td>
                                    <span class="badge bg-dark border border-secondary" th:text="${c.credits} + ' Credits'">3 Credits</span>
                                </td>
                                <td>
                                    <span th:text="${c.instructor != null ? c.instructor.fullName : 'Unassigned'}" class="text-info">Prof. Turing</span>
                                </td>
                                <td class="text-end" sec:authorize="hasRole('ADMIN')">
                                    <div class="btn-group">
                                        <a th:href="@{/courses/edit/{id}(id=${c.id})}" class="btn btn-sm btn-outline-light rounded-start">
                                            <i class="fa-solid fa-pen-to-square"></i>
                                        </a>
                                        <a th:href="@{/courses/delete/{id}(id=${c.id})}" class="btn btn-sm btn-outline-danger rounded-end" onclick="return confirm('Delete course?');">
                                            <i class="fa-solid fa-trash"></i>
                                        </a>
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(courses)}">
                                <td colspan="6" class="text-center text-muted py-5">No courses registered in the catalog yet.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Footer Fragment -->
        <div th:replace="~{fragments/footer :: footer}"></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
