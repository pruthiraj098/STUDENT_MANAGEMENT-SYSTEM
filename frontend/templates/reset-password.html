<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password - Student Management System</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 p-3"
      style="background: radial-gradient(circle at top right, #1e1b4b 0%, #0f172a 60%);">

<div class="glass-card p-4 p-md-5" style="width: 100%; max-width: 480px; border-radius: 20px;">

    <div class="text-center mb-4">
        <div class="brand-icon mx-auto mb-3" style="width: 54px; height: 54px; font-size: 1.6rem;">
            <i class="fa-solid fa-lock"></i>
        </div>
        <h3 class="fw-bold text-white mb-1">Set New Password</h3>
        <p class="text-white mb-0" style="font-size: 0.9rem; color: #ffffff !important;">
            Enter and confirm your new account password below
        </p>
    </div>

    <!-- Error Alert -->
    <div th:if="${errorMsg}"
         class="alert alert-danger border-0 rounded-3 text-center mb-3"
         style="background: rgba(244, 63, 94, 0.25); color: #fecdd3; border: 1px solid rgba(244, 63, 94, 0.4);"
         th:text="${errorMsg}">
    </div>

    <form th:action="@{/reset-password}" method="post">
        <input type="hidden" name="token" th:value="${token}">

        <!-- New Password -->
        <div class="mb-3">
            <label for="passwordInput" class="form-label text-white small fw-semibold" style="color: #ffffff !important;">
                NEW PASSWORD <span class="text-danger">*</span>
            </label>
            <div class="input-group">
                <span class="input-group-text custom-input border-end-0">
                    <i class="fa-solid fa-lock text-muted"></i>
                </span>
                <input type="password"
                       id="passwordInput"
                       name="password"
                       class="form-control custom-input border-start-0"
                       placeholder="At least 6 characters"
                       required
                       minlength="6"
                       autofocus
                       autocomplete="new-password">
            </div>
        </div>

        <!-- Confirm New Password -->
        <div class="mb-4">
            <label for="confirmPasswordInput" class="form-label text-white small fw-semibold" style="color: #ffffff !important;">
                CONFIRM NEW PASSWORD <span class="text-danger">*</span>
            </label>
            <div class="input-group">
                <span class="input-group-text custom-input border-end-0">
                    <i class="fa-solid fa-check-double text-muted"></i>
                </span>
                <input type="password"
                       id="confirmPasswordInput"
                       name="confirmPassword"
                       class="form-control custom-input border-start-0"
                       placeholder="Re-type new password"
                       required
                       minlength="6"
                       autocomplete="new-password">
            </div>
        </div>

        <button type="submit" class="btn btn-gradient-primary w-100 py-2 mb-3">
            <i class="fa-solid fa-floppy-disk me-2"></i> Update Password
        </button>
    </form>

    <div class="text-center mt-3 pt-3 border-top border-secondary border-opacity-25">
        <a th:href="@{/login}" class="text-decoration-none fw-semibold"
           style="color: var(--accent-cyan);">Back to Login</a>
    </div>

    <!-- High-Contrast White Guidelines Box -->
    <div class="mt-4 p-3.5 rounded-3 instruction-box">
        <div class="d-flex align-items-center gap-2 mb-2">
            <i class="fa-solid fa-shield-halved fs-5" style="color: var(--accent-cyan) !important;"></i>
            <h6 class="fw-bold mb-0 text-white" style="color: #ffffff !important;">Password Security Requirements</h6>
        </div>
        <ul class="text-white small mb-0 ps-3" style="color: #ffffff !important; font-size: 0.85rem; line-height: 1.6;">
            <li class="mb-1" style="color: #ffffff !important;">Password must be at least <strong>6 characters</strong> in length.</li>
            <li style="color: #ffffff !important;">Both password fields must match exactly before saving.</li>
        </ul>
    </div>
</div>

</body>
</html>
