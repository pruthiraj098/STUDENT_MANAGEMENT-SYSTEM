<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 p-3" style="background: var(--bg-main);">

<div class="glass-card p-5 text-center" style="max-width: 500px; border-radius: 20px;">
    <div class="display-1 text-warning font-heading fw-bold mb-3">404</div>
    <h3 class="text-white fw-bold mb-2">Page Not Found</h3>
    <p class="text-muted mb-4">The requested page or record could not be located in the Student Management System.</p>
    
    <a th:href="@{/dashboard}" class="btn btn-gradient-primary">
        <i class="fa-solid fa-house me-2"></i> Return to Dashboard
    </a>
</div>

</body>
</html>
