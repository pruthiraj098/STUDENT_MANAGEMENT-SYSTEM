<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instructor Application - Student Management System</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 p-3"
      style="background: radial-gradient(circle at top right, #1e1b4b 0%, #0f172a 60%);">

<div class="glass-card p-4 p-md-5" style="width: 100%; max-width: 580px; border-radius: 20px;">

    <div class="text-center mb-4">
        <div class="brand-icon mx-auto mb-3" style="width: 54px; height: 54px; font-size: 1.6rem; background: var(--gradient-emerald);">
            <i class="fa-solid fa-chalkboard-user"></i>
        </div>
        <h3 class="fw-bold text-white mb-1">Instructor Application</h3>
        <p class="text-muted" style="font-size: 0.9rem;">
            Submit your details for Administrator review and account approval
        </p>
    </div>

    <form th:action="@{/register/instructor}" th:object="${requestDto}" method="post">

        <div class="row g-3 mb-3">
            <div class="col-md-6">
                <label for="firstName" class="form-label text-muted small fw-semibold">FIRST NAME <span class="text-danger">*</span></label>
                <input type="text"
                       id="firstName"
                       th:field="*{firstName}"
                       class="form-control custom-input"
                       placeholder="Alan"
                       required>
                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></div>
            </div>
            <div class="col-md-6">
                <label for="lastName" class="form-label text-muted small fw-semibold">LAST NAME <span class="text-danger">*</span></label>
                <input type="text"
                       id="lastName"
                       th:field="*{lastName}"
                       class="form-control custom-input"
                       placeholder="Turing"
                       required>
                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></div>
            </div>
        </div>

        <div class="mb-3">
            <label for="email" class="form-label text-muted small fw-semibold">EMAIL ADDRESS <span class="text-danger">*</span></label>
            <div class="input-group">
                <span class="input-group-text custom-input border-end-0"><i class="fa-solid fa-envelope text-muted"></i></span>
                <input type="email"
                       id="email"
                       th:field="*{email}"
                       class="form-control custom-input border-start-0"
                       placeholder="prof.alan@sms.edu"
                       required>
            </div>
            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
        </div>

        <div class="row g-3 mb-3">
            <div class="col-md-6">
                <label for="phone" class="form-label text-muted small fw-semibold">PHONE NUMBER <span class="text-danger">*</span></label>
                <input type="text"
                       id="phone"
                       th:field="*{phone}"
                       class="form-control custom-input"
                       placeholder="+1-555-0100"
                       required>
                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
            </div>
            <div class="col-md-6">
                <label for="designation" class="form-label text-muted small fw-semibold">DESIGNATION <span class="text-danger">*</span></label>
                <select id="designation" th:field="*{designation}" class="form-select custom-input" required>
                    <option value="Professor">Professor</option>
                    <option value="Associate Professor">Associate Professor</option>
                    <option value="Assistant Professor">Assistant Professor</option>
                    <option value="Senior Lecturer">Senior Lecturer</option>
                    <option value="Lecturer">Lecturer</option>
                </select>
            </div>
        </div>

        <div class="mb-3">
            <label for="departmentId" class="form-label text-muted small fw-semibold">ACADEMIC DEPARTMENT</label>
            <select id="departmentId" th:field="*{departmentId}" class="form-select custom-input">
                <option value="">-- Select Department (Optional) --</option>
                <option th:each="d : ${departments}" th:value="${d.id}" th:text="${d.name} + ' (' + ${d.code} + ')'"></option>
            </select>
        </div>

        <div class="mb-4">
            <label for="qualification" class="form-label text-muted small fw-semibold">HIGHEST QUALIFICATION / SPECIALIZATION <span class="text-danger">*</span></label>
            <input type="text"
                   id="qualification"
                   th:field="*{qualification}"
                   class="form-control custom-input"
                   placeholder="Ph.D. in Computer Science, Machine Learning focus"
                   required>
            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('qualification')}" th:errors="*{qualification}"></div>
        </div>

        <button type="submit" class="btn btn-emerald w-100 py-2 mb-3" style="background: var(--gradient-emerald); color: white; font-weight: 600; border: none;">
            <i class="fa-solid fa-paper-plane me-2"></i> Submit Application Request
        </button>
    </form>

    <div class="text-center mt-3 pt-3 border-top border-secondary border-opacity-25">
        <a th:href="@{/register}" class="text-decoration-none fw-semibold me-3" style="color: var(--accent-cyan);">Register as Student</a>
        <span class="text-muted">|</span>
        <a th:href="@{/login}" class="text-decoration-none fw-semibold ms-3" style="color: #94a3b8;">Back to Login</a>
    </div>

</div>

</body>
</html>
