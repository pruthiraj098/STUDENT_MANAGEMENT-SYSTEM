<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<header th:fragment="header" class="app-header">
    <div class="d-flex align-items-center gap-3">
        <h4 class="mb-0 font-heading fw-bold" style="color: #042954;"><i class="fa-solid fa-graduation-cap text-warning me-2"></i>Academic Portal</h4>
    </div>

    <!-- Search Input Box -->
    <div class="header-search-box d-none d-md-block">
        <input type="text" class="header-search-input" placeholder="Search Here ...">
        <button class="header-search-btn" type="button">
            <i class="fa-solid fa-magnifying-glass"></i>
        </button>
    </div>

    <div class="d-flex align-items-center gap-3">
        <div class="user-profile-badge">
            <div class="avatar-circle">
                <i class="fa-solid fa-user"></i>
            </div>
            <div class="d-none d-md-block text-start">
                <div class="fw-bold" style="font-size: 0.875rem; color: #111111;" sec:authentication="name">Username</div>
                <div style="font-size: 0.725rem; color: #666666;" sec:authentication="principal.authorities[0]">Role</div>
            </div>
        </div>
    </div>
</header>
</body>
</html>
