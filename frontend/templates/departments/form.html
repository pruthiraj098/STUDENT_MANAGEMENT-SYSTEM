<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${isEdit ? 'Edit Department' : 'Create Department'}">Department Form</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<div class="app-wrapper">
    <!-- Sidebar Fragment -->
    <div th:replace="~{fragments/sidebar :: sidebar('departments')}"></div>

    <div class="app-main">
        <!-- Header Fragment -->
        <div th:replace="~{fragments/header :: header}"></div>

        <div class="p-4 p-md-5">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h3 class="text-white font-heading fw-bold mb-1" th:text="${isEdit ? 'Edit Department' : 'Create New Department'}">Department Form</h3>
                    <p class="text-muted mb-0">Enter academic department details</p>
                </div>
                <a th:href="@{/departments}" class="btn btn-outline-light rounded-3">
                    <i class="fa-solid fa-arrow-left me-1"></i> Back to List
                </a>
            </div>

            <div class="glass-card p-4 p-md-5" style="max-width: 650px; margin: 0 auto;">
                <form th:action="@{/departments/save}" th:object="${department}" method="post">
                    <input type="hidden" th:field="*{id}">

                    <div class="mb-3">
                        <label class="form-label text-muted small fw-semibold">DEPARTMENT CODE *</label>
                        <input type="text" th:field="*{code}" class="form-control custom-input" placeholder="e.g. CSE" required>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('code')}" th:errors="*{code}"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-muted small fw-semibold">DEPARTMENT NAME *</label>
                        <input type="text" th:field="*{name}" class="form-control custom-input" placeholder="e.g. Computer Science & Engineering" required>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-muted small fw-semibold">BUILDING / CAMPUS LOCATION</label>
                        <input type="text" th:field="*{building}" class="form-control custom-input" placeholder="e.g. Turing Hall">
                    </div>

                    <div class="mb-4">
                        <label class="form-label text-muted small fw-semibold">DESCRIPTION</label>
                        <textarea th:field="*{description}" class="form-control custom-input" rows="3" placeholder="Department academic focus..."></textarea>
                    </div>

                    <div class="text-end">
                        <a th:href="@{/departments}" class="btn btn-outline-secondary me-2 rounded-3">Cancel</a>
                        <button type="submit" class="btn btn-gradient-primary">
                            <i class="fa-solid fa-floppy-disk me-1"></i> Save Department
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Footer Fragment -->
        <div th:replace="~{fragments/footer :: footer}"></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
