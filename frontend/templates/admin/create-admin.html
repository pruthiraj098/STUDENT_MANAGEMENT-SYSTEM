<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Administrator - Student Management System</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<div class="app-wrapper">
    <!-- Sidebar Fragment -->
    <div th:replace="~{fragments/sidebar :: sidebar('admin')}"></div>

    <div class="app-main">
        <!-- Header Fragment -->
        <div th:replace="~{fragments/header :: header}"></div>

        <div class="p-4 p-md-5">
            <div class="d-flex align-items-center justify-content-between mb-4">
                <div>
                    <h3 class="text-white font-heading fw-bold mb-1"><i class="fa-solid fa-user-shield me-2 text-danger"></i> Authorize Administrator Account</h3>
                    <p class="text-muted mb-0">Only existing authorized administrators can generate secondary administrator credentials</p>
                </div>
                <a th:href="@{/dashboard}" class="btn btn-outline-secondary rounded-3">
                    <i class="fa-solid fa-arrow-left me-1"></i> Back to Dashboard
                </a>
            </div>

            <div th:if="${errorMsg}" class="alert alert-danger border-0 rounded-3 mb-4" style="background: rgba(239, 68, 68, 0.2); color: #fca5a5;" th:text="${errorMsg}"></div>

            <div class="glass-card p-4 p-md-5" style="max-width: 650px;">
                <form th:action="@{/admin/create-admin}" method="post">

                    <div class="mb-3">
                        <label for="email" class="form-label text-muted small fw-semibold">ADMINISTRATOR EMAIL ADDRESS <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text custom-input border-end-0"><i class="fa-solid fa-envelope text-muted"></i></span>
                            <input type="email" id="email" name="email" class="form-control custom-input border-start-0" placeholder="admin.name@sms.edu" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="username" class="form-label text-muted small fw-semibold">SYSTEM USERNAME (OPTIONAL)</label>
                        <div class="input-group">
                            <span class="input-group-text custom-input border-end-0"><i class="fa-solid fa-user text-muted"></i></span>
                            <input type="text" id="username" name="username" class="form-control custom-input border-start-0" placeholder="Leave empty to generate from email">
                        </div>
                    </div>

                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label for="password" class="form-label text-muted small fw-semibold">PASSWORD <span class="text-danger">*</span></label>
                            <input type="password" id="password" name="password" class="form-control custom-input" placeholder="Min 6 characters" required>
                        </div>
                        <div class="col-md-6">
                            <label for="confirmPassword" class="form-label text-muted small fw-semibold">CONFIRM PASSWORD <span class="text-danger">*</span></label>
                            <input type="password" id="confirmPassword" name="confirmPassword" class="form-control custom-input" placeholder="Re-enter password" required>
                        </div>
                    </div>

                    <div class="alert alert-dark border-secondary bg-dark bg-opacity-50 text-white small mb-4">
                        <i class="fa-solid fa-triangle-exclamation text-warning me-2"></i> <strong>Privilege Notice:</strong> Users created through this form will be granted full system administration privileges (`ROLE_ADMIN`).
                    </div>

                    <div class="d-flex gap-3">
                        <button type="submit" class="btn btn-danger px-4 py-2" style="background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%); border: none;">
                            <i class="fa-solid fa-user-shield me-2"></i> Authorize Admin Account
                        </button>
                        <a th:href="@{/dashboard}" class="btn btn-outline-secondary px-4 py-2">Cancel</a>
                    </div>
                </form>
            </div>
        </div>

        <!-- Footer Fragment -->
        <div th:replace="~{fragments/footer :: footer}"></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
