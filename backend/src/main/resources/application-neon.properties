# Neon PostgreSQL Database Configuration Profile
# Activate via command line: --spring.profiles.active=neon or set spring.profiles.active=neon in application.properties

# Neon Database URL (Replace placeholder values or use Environment Variables)
spring.datasource.url=jdbc:postgresql://${NEON_HOST:ep-your-endpoint-name.region.aws.neon.tech}/${NEON_DB:neondb}?sslmode=require
spring.datasource.username=${NEON_USER:neondb_owner}
spring.datasource.password=${NEON_PASSWORD:your_neon_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Settings for PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
