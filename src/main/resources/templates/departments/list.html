<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Departments - Student Management System</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<div class="app-wrapper">
    <!-- Sidebar Fragment -->
    <div th:replace="~{fragments/sidebar :: sidebar('departments')}"></div>

    <div class="app-main">
        <!-- Header Fragment -->
        <div th:replace="~{fragments/header :: header}"></div>

        <div class="p-4 p-md-5">
            <div th:if="${successMsg}" class="alert alert-success border-0 rounded-3 mb-4" style="background: rgba(16, 185, 129, 0.2); color: #a7f3d0;" th:text="${successMsg}"></div>

            <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4">
                <div>
                    <h3 class="text-white font-heading fw-bold mb-1">Academic Departments</h3>
                    <p class="text-muted mb-0">Manage university departments and facilities</p>
                </div>
                <div sec:authorize="hasAnyRole('ADMIN', 'INSTRUCTOR')">
                    <a th:href="@{/departments/new}" class="btn btn-gradient-primary">
                        <i class="fa-solid fa-plus me-1"></i> Add Department
                    </a>
                </div>
            </div>

            <div class="row g-4">
                <div th:each="d : ${departments}" class="col-md-6 col-lg-4">
                    <div class="glass-card p-4 h-100 d-flex flex-column justify-content-between">
                        <div>
                            <div class="d-flex justify-content-between align-items-start mb-3">
                                <div class="badge bg-primary fs-6 px-3 py-2" th:text="${d.code}">CSE</div>
                                <div sec:authorize="hasAnyRole('ADMIN', 'INSTRUCTOR')">
                                    <a th:href="@{/departments/edit/{id}(id=${d.id})}" class="text-muted me-2" title="Edit"><i class="fa-solid fa-pen-to-square"></i></a>
                                    <a th:href="@{/departments/delete/{id}(id=${d.id})}" class="text-danger" title="Delete" onclick="return confirm('Delete department?');"><i class="fa-solid fa-trash"></i></a>
                                </div>
                            </div>

                            <h4 class="text-white font-heading fw-bold mb-2" th:text="${d.name}">Department Name</h4>
                            <p class="text-muted small mb-3" th:text="${d.description}">Description of department</p>
                        </div>

                        <div class="pt-3 border-top border-secondary border-opacity-25 d-flex justify-content-between align-items-center text-muted small">
                            <span><i class="fa-solid fa-building me-1 text-info"></i> <span th:text="${d.building != null ? d.building : 'Main Campus'}">Building</span></span>
                        </div>
                    </div>
                </div>

                <div th:if="${#lists.isEmpty(departments)}" class="col-12 text-center text-muted py-5">
                    No departments found.
                </div>
            </div>
        </div>

        <!-- Footer Fragment -->
        <div th:replace="~{fragments/footer :: footer}"></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
