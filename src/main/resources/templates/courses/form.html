<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${isEdit ? 'Edit Course' : 'Create New Course'}">Course Form</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<div class="app-wrapper">
    <!-- Sidebar Fragment -->
    <div th:replace="~{fragments/sidebar :: sidebar('courses')}"></div>

    <div class="app-main">
        <!-- Header Fragment -->
        <div th:replace="~{fragments/header :: header}"></div>

        <div class="p-4 p-md-5">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h3 class="text-white font-heading fw-bold mb-1" th:text="${isEdit ? 'Edit Course Details' : 'Create New Course'}">Course Form</h3>
                    <p class="text-muted mb-0">Define course parameters, credits, and instructor assignment</p>
                </div>
                <a th:href="@{/courses}" class="btn btn-outline-light rounded-3">
                    <i class="fa-solid fa-arrow-left me-1"></i> Back to Catalog
                </a>
            </div>

            <div class="glass-card p-4 p-md-5" style="max-width: 750px; margin: 0 auto;">
                <form th:action="@{/courses/save}" th:object="${courseDto}" method="post">
                    <input type="hidden" th:field="*{id}">

                    <div class="row g-4">
                        <div class="col-md-6">
                            <label class="form-label text-muted small fw-semibold">COURSE CODE *</label>
                            <input type="text" th:field="*{code}" class="form-control custom-input" placeholder="e.g. CS101" required>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('code')}" th:errors="*{code}"></div>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label text-muted small fw-semibold">CREDITS *</label>
                            <input type="number" th:field="*{credits}" min="1" max="10" class="form-control custom-input" required>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('credits')}" th:errors="*{credits}"></div>
                        </div>

                        <div class="col-12">
                            <label class="form-label text-muted small fw-semibold">COURSE TITLE *</label>
                            <input type="text" th:field="*{title}" class="form-control custom-input" placeholder="e.g. Data Structures and Algorithms" required>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label text-muted small fw-semibold">DEPARTMENT *</label>
                            <select th:field="*{departmentId}" class="form-select custom-input" required>
                                <option value="">-- Select Department --</option>
                                <option th:each="d : ${departments}" th:value="${d.id}" th:text="${d.name}"></option>
                            </select>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('departmentId')}" th:errors="*{departmentId}"></div>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label text-muted small fw-semibold">ASSIGNED INSTRUCTOR</label>
                            <select th:field="*{instructorId}" class="form-select custom-input">
                                <option value="">-- Unassigned --</option>
                                <option th:each="i : ${instructors}" th:value="${i.id}" th:text="${i.fullName} + ' (' + ${i.designation} + ')'"></option>
                            </select>
                        </div>

                        <div class="col-12">
                            <label class="form-label text-muted small fw-semibold">COURSE DESCRIPTION</label>
                            <textarea th:field="*{description}" class="form-control custom-input" rows="3" placeholder="Brief outline of syllabus..."></textarea>
                        </div>

                        <div class="col-12 mt-4 text-end">
                            <a th:href="@{/courses}" class="btn btn-outline-secondary me-2 rounded-3">Cancel</a>
                            <button type="submit" class="btn btn-gradient-primary">
                                <i class="fa-solid fa-floppy-disk me-1"></i> Save Course
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <!-- Footer Fragment -->
        <div th:replace="~{fragments/footer :: footer}"></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
